name: MIRAI on MIRAI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_with_vcpkg_installed_z3:
    strategy:
      matrix:
        build: [ linux, macos, windows ]
        include:
          - build: linux
            os: ubuntu-latest
            vcpkg_triplet: x64-linux
          - build: macos
            os: macos-latest
            vcpkg_triplet: arm64-osx
          - build: windows
            os: windows-latest
            vcpkg_triplet: x64-windows-static-md
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install LLVM and Clang # required for bindgen to work, see https://github.com/rust-lang/rust-bindgen/issues/1797
        uses: KyleMayes/install-llvm-action@1a3da29f56261a1e1f937ec88f0856a9b8321d7e # v1
        if: matrix.os == 'windows-latest'
        with:
          version: "11.0"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$((gcm clang).source -replace "clang.exe")" >> $env:GITHUB_ENV
        if: matrix.os == 'windows-latest'
      - name: Check out vcpkg
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Build Z3 with vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install "z3:${{ matrix.vcpkg_triplet }}" --clean-buildtrees-after-build
      - name: Build Z3 with vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install "z3:${{ matrix.vcpkg_triplet }}" --clean-buildtrees-after-build
      - name: Install MIRAI
        run: |
          cargo install --force --path ./checker --no-default-features --features=vcpkg
      - name: Run MIRAI on MIRAI
        run: |
          cargo mirai --no-default-features --features=vcpkg
        if: matrix.os != 'windows-latest'
