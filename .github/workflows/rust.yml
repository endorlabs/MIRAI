name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run Clippy
        run: |
          cargo clippy --no-default-features --all-targets -- -D warnings

  tests:
    runs-on: macos-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: vcpkg build z3
        uses: johnwason/vcpkg-action@3839b028ca2400865ef5e83a899f336b1b8fd711 # v5
        id: vcpkg
        with:
          pkgs: z3
          triplet: arm64-osx
          cache-key: macos-latest
          revision: master
          token: ${{ github.token }}
          extra-args: --clean-buildtrees-after-build

      - name: Execute tests
        run: |
          cargo test --all -- --test-threads=1
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-Ccodegen-units=1 -Copt-level=0 -Clink-dead-code -Coverflow-checks=off -Zpanic_abort_tests"

  #      - name: Setup grcov
  #        run: |
  #          cargo install grcov
  #
  #      - name: Run grcov
  #        run: |
  #          zip -0 cov.zip $(find . -name "mirai*.gc*" -print)
  #          grcov cov.zip -s . -t lcov --llvm --ignore-not-existing --ignore "/*" -o lcov.info
  #
  #      - name: Upload coverage data to codecov.io
  #        uses: codecov/codecov-action@v3
  #        with:
  #          token: ${{ secrets.CODECOV_TOKEN }}
  #          files: "lcov.info"

  mirai_on_mirai_ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install MIRAI
        run: |
          cargo install --force --path ./checker

      - name: Run MIRAI on MIRAI
        run: |
          cargo mirai --no-default-features